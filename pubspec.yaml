name: cubanum
description: CUBANUM - Control numismático personal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Almacenamiento local
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Multimedia
  image_picker: ^1.1.2

  # Exportación y compartir
  pdf: ^3.11.0
  printing: ^5.13.1
  syncfusion_flutter_xlsio: ^35.0.0
  share_plus: ^10.1.4

  # Utilidades
  intl: any                         # <-- CAMBIO: deja que flutter_localizations decida
  provider: ^6.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
